notes: No public pricing — AVEVA (formerly OSIsoft) sells the PI System under a subscription
  model negotiated through account representatives. Per the AVEVA product page, "AVEVA is
  transitioning to a subscription-based commercial model" and customers are directed to contact
  their local rep for pricing. No published per-API price, MAU cap, or developer plan.
tags:
  - Industrial
  - Process Historian
  - SCADA
  - Time Series
  - Manufacturing
  - Energy
description: AVEVA PI System (formerly OSIsoft PI) is licensed via enterprise subscription
  agreements with no public price list. The PI Web API and AVEVA CONNECT Data Services are
  accessed under the platform license; pricing is custom and negotiated per deployment.
sources:
  - https://www.aveva.com/en/products/aveva-pi-system/
plans:
  - id: osisoft-pi-enterprise
    name: Enterprise Subscription
    type: enterprise
    description: AVEVA PI System enterprise subscription. Pricing is custom and structured
      per-deployment (size, modules, hosting, support). Contact AVEVA sales.
    entries:
      - label: Annual Subscription
        name: annual_subscription
        type: subscription
        metric: year
        limit: -1
        timeFrame: year
        geo: configurable
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: PI Web API
      - name: AVEVA CONNECT Data Services
      - name: PI AF SDK
      - name: On-Premises and Cloud Deployment
      - name: Custom Support Tier
