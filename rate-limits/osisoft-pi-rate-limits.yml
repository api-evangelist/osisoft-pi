specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: osisoft-pi
providerId: osisoft-pi
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
notes: No public rate-limit documentation. PI Web API is typically deployed on customer-controlled
  infrastructure (on-prem or self-managed cloud), so throughput is bounded by the customer's
  PI Server sizing and IIS configuration rather than a vendor-published quota. AVEVA CONNECT
  Data Services rate limits, where they exist, are gated behind authenticated developer documentation.
tags:
  - Rate Limiting
  - Industrial
  - Time Series
  - Process Historian
description: PI System APIs do not publish per-account rate limits. PI Web API throughput
  is governed by customer-deployed PI Server / IIS capacity. AVEVA CONNECT Data Services
  limits are enterprise-customer-specific and disclosed under contract.
sources:
  - https://www.aveva.com/en/products/aveva-pi-system/
responseCodes:
  throttled: 429
limits:
  - name: PI Web API - Customer-Hosted
    scope: deployment
    metric: varies
    limit: bounded by customer-deployed PI Server and IIS configuration
    notes: PI Web API runs on customer infrastructure; throughput depends on installation
      sizing rather than a vendor-set quota.
  - name: AVEVA CONNECT Data Services
    scope: tenant
    metric: varies
    limit: see AVEVA CONNECT documentation behind developer login
    notes: Cloud service limits are tenant-specific and disclosed under enterprise agreement.
policies:
  - name: Customer-Operated Throttling
    description: Because PI Web API is typically self-hosted, throttling, retry, and backoff
      decisions are made by the customer's API gateway or proxy in front of PI Server.
  - name: Backoff
    description: Standard exponential backoff with jitter is recommended on any 429 / 503
      response.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
