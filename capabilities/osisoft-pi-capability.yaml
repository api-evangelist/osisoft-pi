      - name: endTime
        type: string
        description: endTime
      - name: interval
        type: string
        description: Interval between values (e.g. "1h", "5m")
      - name: desiredUnits
        type: string
        description: desiredUnits
      - name: maxCount
        type: integer
        description: maxCount
      - name: selectedFields
        type: string
