specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: osisoft-pi
providerId: osisoft-pi
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
notes: No public pricing or usage API. AVEVA PI System is sold under enterprise subscription
  agreements; FinOps mapping below is a structural placeholder pending contractual disclosure.
tags:
  - FinOps
  - FOCUS
  - Industrial
  - Time Series
  - Process Historian
description: Structural FinOps definition for AVEVA PI System (OSIsoft PI). Pricing is enterprise-subscription
  only with no public meter rates; this artifact captures the FOCUS-shaped fields available
  from the public product page only.
sources:
  - https://www.aveva.com/en/products/aveva-pi-system/
  - https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: AVEVA Group plc
serviceCategory: Industrial Software
billingModel:
  pricingCategory: Subscription (Enterprise)
  billingFrequency: Annual
  billingCurrency: USD (varies by region)
  chargeCategories:
    - Purchase
    - Usage
    - Tax
focusColumns:
  ServiceName: AVEVA PI System
  ServiceCategory: Industrial Software
  ProviderName: AVEVA
  PublisherName: AVEVA Group plc
  InvoiceIssuerName: AVEVA Group plc
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: pi_subscription
    description: Annual PI System subscription, sized per deployment
    unit: subscription-year
    aggregation: count
    dimensions:
      - module
      - deployment
  - name: connect_data_volume
    description: AVEVA CONNECT Data Services data volume (where applicable)
    unit: varies
    aggregation: sum
    dimensions:
      - tenant
      - service
principles:
  - name: Visibility
    description: PI System usage visibility comes from the customer's own monitoring of PI
      Server, PI Web API, and CONNECT tenant dashboards; AVEVA does not provide a public
      cost API.
  - name: Allocation
    description: Allocate by module (PI Server, PI Vision, AF SDK, CONNECT) and by site/business
      unit using the deployment topology; tag PI assets in the AF hierarchy by cost center.
  - name: Optimization
    description: Right-size PI Server tag counts and CONNECT data ingestion. Negotiate at
      renewal based on actual asset/tag growth rather than initial estimates.
  - name: Accountability
    description: Designate a PI System owner per site responsible for renewal forecasting
      and license utilization tracking against the AVEVA contract.
maintainers:
